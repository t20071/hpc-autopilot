[project]
name = "hpc-autopilot"
version = "0.1.0"
description = "A self-driving mini HPC scheduler with an admin dashboard: submit, queue, schedule, run, email, monitor."
authors = [
    { name = "Sharad Pardhe", email = "t20071@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "streamlit>=1.66.0",
]

[project.scripts]
hpc = "hpc_autopilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
